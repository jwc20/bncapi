version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - DJANGO_SETTINGS_MODULE=bncapi.settings
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_CHANNEL_LAYER_URL=redis://redis:6379
      - PUBLIC_API_URL=http://localhost:8000/api
      - SECRET_KEY=my_precious_secret_key_for_local_prod
      - SQLITE_DB_DIR=/usr/src/app/data
    volumes:
      - sqlite_data:/usr/src/app/data
    depends_on:
      - redis
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    restart: always
    expose:
      - 6379
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  sqlite_data:
